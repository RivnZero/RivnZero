<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 196" width="435" height="196" role="img" aria-label="More on GitHub. Forks, experiments and everything else.">
<defs><style>
@font-face{font-family:'GDisplay';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'GSans';src:url(data:font/woff2;base64,) format('woff2');}

.d{font-family:'GDisplay',Geist,Inter,system-ui,sans-serif;font-weight:500;}
.s{font-family:'GSans',Geist,Inter,system-ui,sans-serif;}
.m{font-family:'GMono','Geist Mono',ui-monospace,monospace;}
.rise{animation:rise 720ms cubic-bezier(.22,1,.36,1) both;}
@keyframes rise{0%{opacity:0;transform:translateY(14px);}}
.word{animation:word 900ms cubic-bezier(.22,1,.36,1) both;}
@keyframes word{0%{opacity:0;transform:translateY(.32em);filter:blur(10px);}}
.fadein{animation:fadein 1100ms cubic-bezier(.22,1,.36,1) both;}
@keyframes fadein{0%{opacity:0;}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1200ms cubic-bezier(.22,1,.36,1) both;}
@keyframes grow{0%{transform:scaleX(0);}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}


</style></defs>
<g class="rise" style="animation-delay:0.00s"><rect x="0.0" y="0.0" width="435.0" height="196.0" rx="24" fill="#171717"/><rect x="24.0" y="24.0" width="92.0" height="24" rx="12.0" fill="#222222"/><text x="35.0" y="40.2" class="s" font-size="12" fill="#a8a8a8">Repositories</text><circle cx="389.0" cy="46" r="22" fill="#222222"/><path d="M384.0 51l10-10M386.0 41h8v8" fill="none" stroke="#f2f2f2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="140" class="d" font-size="21" letter-spacing="-.4" fill="#f2f2f2">More on GitHub</text><text x="24" y="166" class="s" font-size="14" fill="#a8a8a8">Forks, experiments and everything else.</text></g>
</svg>
